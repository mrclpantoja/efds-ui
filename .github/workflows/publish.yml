name: Publicar no npm

# Publica os pacotes @efds-ui/* com proveniência, pela publicação confiável do npm (OIDC):
# nenhum token do npm fica guardado no GitHub.
#
# - Tag `v<versão>` (ex.: v1.0.0): roda todas as verificações e envia em etapas (npm stage
#   publish); cada versão só fica pública depois de aprovada com 2FA em npmjs.com.
# - Execução manual (Actions > Publicar no npm > Run workflow): só simula (--dry-run).
#
# Dois jobs: `build` instala, verifica e empacota sem nenhuma credencial; `publish` (ambiente
# `npm`, o único com id-token) só recebe os tarballs e envia, sem install nem build. Actions
# fixadas pelo SHA do commit (o comentário diz a versão) e npm em versão exata.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - run: pnpm format:check
      - run: pnpm lint
      # O typecheck dos apps e templates resolve os pacotes pelo dist/: build antes.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm pack:check
      - run: pnpm size:check
      - run: node scripts/publish.ts --pack tarballs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarballs
          path: tarballs
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Ambiente com o mesmo nome configurado no npm (Trusted Publisher). No GitHub ele exige
    # aprovação manual e só aceita tags v* (Settings > Environments > npm).
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # A publicação em etapas exige npm 11.15.0 ou mais novo; versão exata para não variar.
      - run: npm install -g npm@11.21.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tarballs
          path: tarballs
      - name: Enviar para aprovação
        if: github.event_name == 'push'
        run: node scripts/publish.ts --from tarballs
      - name: Simular publicação
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/publish.ts --from tarballs --dry-run
