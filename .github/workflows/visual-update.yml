name: Atualizar capturas da regressão visual

# Gera (ou regrava) as capturas de referência no mesmo ambiente do CI (Linux, chromium do
# Playwright) e as publica como artefato. Nada é commitado aqui: baixe o artefato, extraia em
# tests/e2e/__screenshots__/ e faça o commit. Passo a passo em docs/architecture/testes.md.
on:
  workflow_dispatch:

jobs:
  capturas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @efds-ui/e2e exec playwright install --with-deps chromium
      - name: Gerar as capturas
        env:
          VISUAL_UPDATE: '1'
        run: pnpm e2e --project=visual --update-snapshots=all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capturas-visuais
          path: tests/e2e/__screenshots__/linux
          if-no-files-found: error
          retention-days: 14
