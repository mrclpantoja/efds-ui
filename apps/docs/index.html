<!doctype html>
<html lang="pt-BR" data-theme="blue" data-mode="light" data-density="comfortable" data-shape="soft">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Aparência salva (tema, modo, densidade, forma), aplicada antes da primeira pintura.
      // Sem preferência salva, o modo é claro (data-mode="light" acima).
      (function () {
        var root = document.documentElement;
        var saved = {};
        try {
          saved = JSON.parse(localStorage.getItem('eds-docs-appearance') || '{}') || {};
        } catch (e) {}
        ['theme', 'mode', 'density', 'shape'].forEach(function (axis) {
          if (typeof saved[axis] === 'string') root.setAttribute('data-' + axis, saved[axis]);
        });
      })();
    </script>
    <title>efDS.ui · Documentação</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
