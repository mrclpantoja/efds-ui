<!-- Os botões dentro de .eds-alert-actions herdam o tom do alerta: secondary vira contorno na cor do
     status, ghost fica sem borda e primary usa a cor do status como fundo. -->
<div class="eds-stack eds-gap-3">
  <div class="eds-alert eds-alert-danger">
    <div class="eds-alert-content">
      <p class="eds-alert-title"><span class="eds-visually-hidden">Erro: </span>Falha na conciliação</p>
      <p>12 lançamentos não puderam ser conciliados com o extrato.</p>
    </div>
    <div class="eds-alert-actions">
      <button type="button" class="eds-button eds-button-primary eds-button-sm">Tentar de novo</button>
      <button type="button" class="eds-button eds-button-secondary eds-button-sm">Ver detalhes</button>
      <button type="button" class="eds-button eds-button-ghost eds-button-sm">Ignorar</button>
    </div>
  </div>
  <div class="eds-alert eds-alert-warning">
    <div class="eds-alert-content">
      <p class="eds-alert-title"><span class="eds-visually-hidden">Atenção: </span>Fechamento próximo</p>
      <p>O período fecha em 2 dias.</p>
    </div>
    <div class="eds-alert-actions">
      <button type="button" class="eds-button eds-button-primary eds-button-sm">Revisar</button>
      <button type="button" class="eds-button eds-button-secondary eds-button-sm">Ver pendências</button>
      <button type="button" class="eds-button eds-button-ghost eds-button-sm">Lembrar depois</button>
    </div>
  </div>
  <div class="eds-alert eds-alert-success">
    <div class="eds-alert-content">
      <p class="eds-alert-title"><span class="eds-visually-hidden">Sucesso: </span>Importação concluída</p>
      <p>248 registros foram importados.</p>
    </div>
    <div class="eds-alert-actions">
      <button type="button" class="eds-button eds-button-primary eds-button-sm">Abrir lista</button>
      <button type="button" class="eds-button eds-button-secondary eds-button-sm">Baixar relatório</button>
      <button type="button" class="eds-button eds-button-ghost eds-button-sm">Dispensar</button>
    </div>
  </div>
  <div class="eds-alert eds-alert-info">
    <div class="eds-alert-content">
      <p class="eds-alert-title"><span class="eds-visually-hidden">Informação: </span>Nova versão disponível</p>
      <p>As alterações entram em vigor no próximo acesso.</p>
    </div>
    <div class="eds-alert-actions">
      <button type="button" class="eds-button eds-button-primary eds-button-sm">Atualizar</button>
      <button type="button" class="eds-button eds-button-secondary eds-button-sm">Novidades</button>
      <button type="button" class="eds-button eds-button-ghost eds-button-sm">Depois</button>
    </div>
  </div>
</div>
