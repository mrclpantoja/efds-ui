<!-- Sem JS do pacote. Grupo com role="group" + aria-label; cada avatar leva o nome. O excedente é um avatar
     "+3" com o nome "Mais 3 pessoas" (o React <AvatarGroup max> monta isso). -->
<div class="eds-avatar-group" role="group" aria-label="Responsáveis pelo projeto">
  <span class="eds-avatar eds-avatar-tone-1" role="img" aria-label="Ana Exemplo">AE</span>
  <span class="eds-avatar eds-avatar-tone-2" role="img" aria-label="Bruno Teste">BT</span>
  <span class="eds-avatar eds-avatar-tone-3" role="img" aria-label="Carla Modelo">CM</span>
  <span class="eds-avatar eds-avatar-tone-5" role="img" aria-label="Diego Fictício">DF</span>
  <span class="eds-avatar eds-avatar-more" role="img" aria-label="Mais 3 pessoas">+3</span>
</div>
