<!-- Sem JS do pacote. O status é .eds-avatar-status[data-status] dentro do avatar. A cor não é a única pista:
     online = ponto cheio, busy = ponto com traço, away/offline = anel vazio. O status vai no aria-label. -->
<div class="eds-stack eds-stack-row eds-stack-wrap eds-gap-5">
  <span class="eds-avatar eds-avatar-tone-1" role="img" aria-label="Ana Exemplo, online">AE<span class="eds-avatar-status" data-status="online"></span></span>
  <span class="eds-avatar eds-avatar-tone-2" role="img" aria-label="Bruno Teste, ocupado">BT<span class="eds-avatar-status" data-status="busy"></span></span>
  <span class="eds-avatar eds-avatar-tone-3" role="img" aria-label="Carla Modelo, ausente">CM<span class="eds-avatar-status" data-status="away"></span></span>
  <span class="eds-avatar eds-avatar-tone-6" role="img" aria-label="Diego Fictício, offline">DF<span class="eds-avatar-status" data-status="offline"></span></span>
</div>
