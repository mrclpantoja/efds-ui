<!-- Os botões dentro de .eds-banner-actions herdam o tom do aviso (secondary em contorno, ghost sem
     borda, primary com a cor do tom como fundo), inclusive no neutro. -->
<div class="eds-stack eds-gap-3">
  <div class="eds-banner eds-banner-info" role="region" aria-label="Novidade">
    <p class="eds-banner-text"><strong>Novidade.</strong> Painel de indicadores renovado.</p>
    <div class="eds-banner-actions">
      <button type="button" class="eds-button eds-button-primary eds-button-sm">Conhecer</button>
      <button type="button" class="eds-button eds-button-secondary eds-button-sm">Depois</button>
    </div>
  </div>
  <div class="eds-banner eds-banner-warning" role="region" aria-label="Manutenção">
    <p class="eds-banner-text"><strong>Manutenção programada.</strong> Sábado, das 22h às 23h.</p>
    <div class="eds-banner-actions">
      <button type="button" class="eds-button eds-button-primary eds-button-sm">Saiba mais</button>
      <button type="button" class="eds-button eds-button-ghost eds-button-sm">Lembrar</button>
    </div>
  </div>
  <div class="eds-banner eds-banner-danger" role="region" aria-label="Incidente">
    <p class="eds-banner-text"><strong>Instabilidade.</strong> A emissão de guias está lenta.</p>
    <div class="eds-banner-actions">
      <button type="button" class="eds-button eds-button-secondary eds-button-sm">Status do serviço</button>
    </div>
  </div>
  <div class="eds-banner eds-banner-success" role="region" aria-label="Normalizado">
    <p class="eds-banner-text"><strong>Normalizado.</strong> Todos os serviços voltaram a funcionar.</p>
    <div class="eds-banner-actions">
      <button type="button" class="eds-button eds-button-secondary eds-button-sm">Ver relatório</button>
    </div>
  </div>
  <div class="eds-banner eds-banner-neutral" role="region" aria-label="Aviso legal">
    <p class="eds-banner-text">Este sistema registra os acessos.</p>
    <div class="eds-banner-actions">
      <button type="button" class="eds-button eds-button-primary eds-button-sm">Li e concordo</button>
      <button type="button" class="eds-button eds-button-secondary eds-button-sm">Política</button>
    </div>
  </div>
</div>
