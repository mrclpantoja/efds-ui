<!-- Behavior: [data-eds-cep] no input de CEP (a máscara "cep" é aplicada junto) e
     data-eds-cep-fill="campo:#seletor,..." (logradouro, bairro, localidade, uf). Ao completar 8 dígitos
     consulta a fonte de CEP; o padrão é VAZIO (nenhuma chamada externa): configure({ cepUrl }) com o serviço
     escolhido pelo autor (ex.: "https://viacep.com.br/ws/{cep}/json/") ou use uma rota sua. Estados: carregando
     (aria-busy no grupo + spinner, tirar o hidden), não encontrado e falha de rede (p.eds-error; a falha traz
     o botão "Tentar de novo"). Evento: eds:cep-result. CEP fictício. -->
<div class="eds-grid eds-grid-auto">
  <div class="eds-field">
    <label class="eds-label" for="cep-cep">CEP</label>
    <div class="eds-input-group">
      <input class="eds-input" id="cep-cep" name="cep" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000"
        data-eds-cep data-eds-mask="cep" data-eds-cep-fill="logradouro:#cep-rua,bairro:#cep-bairro,localidade:#cep-cidade,uf:#cep-uf"
        aria-describedby="cep-cep-msg" />
      <span class="eds-input-group-text" hidden>
        <span class="eds-spinner eds-spinner-sm" role="status"><span class="eds-visually-hidden">Buscando endereço</span></span>
      </span>
    </div>
    <p class="eds-error" id="cep-cep-msg" hidden></p>
  </div>
  <div class="eds-field">
    <label class="eds-label" for="cep-rua">Logradouro</label>
    <input class="eds-input" id="cep-rua" name="logradouro" autocomplete="address-line1" />
  </div>
  <div class="eds-field">
    <label class="eds-label" for="cep-bairro">Bairro</label>
    <input class="eds-input" id="cep-bairro" name="bairro" />
  </div>
  <div class="eds-field">
    <label class="eds-label" for="cep-cidade">Cidade</label>
    <input class="eds-input" id="cep-cidade" name="cidade" autocomplete="address-level2" />
  </div>
  <div class="eds-field">
    <label class="eds-label" for="cep-uf">UF</label>
    <input class="eds-input" id="cep-uf" name="uf" maxlength="2" autocomplete="address-level1" />
  </div>
</div>
