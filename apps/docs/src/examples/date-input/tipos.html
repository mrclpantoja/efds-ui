<div class="eds-grid eds-grid-auto">
  <div class="eds-field">
    <label class="eds-label" for="di-data">Data</label>
    <input id="di-data" class="eds-input" type="date" name="data" value="2026-03-15" />
  </div>
  <div class="eds-field">
    <label class="eds-label" for="di-hora">Hora</label>
    <input id="di-hora" class="eds-input" type="time" name="hora" value="14:30" />
  </div>
  <div class="eds-field">
    <label class="eds-label" for="di-dh">Data e hora</label>
    <input id="di-dh" class="eds-input" type="datetime-local" name="reuniao" value="2026-03-15T14:30" />
  </div>
  <div class="eds-field">
    <label class="eds-label" for="di-mes">Competência</label>
    <input id="di-mes" class="eds-input" type="month" name="competencia" value="2026-03" />
  </div>
</div>
