<div class="eds-field">
  <label class="eds-label" for="dp-blq">Data da entrega</label>
  <div class="eds-datepicker" data-eds-datepicker data-eds-disable-weekends
    data-eds-disabled-dates="2026-11-20,2026-12-25,2027-01-01">
    <input id="dp-blq" class="eds-input eds-datepicker-input" type="text" inputmode="numeric" maxlength="10"
      placeholder="dd/mm/aaaa" autocomplete="off" aria-describedby="dp-blq-h" />
    <button type="button" class="eds-datepicker-toggle" aria-label="Escolher data"></button>
    <input type="hidden" name="entrega" />
    <div class="eds-calendar" popover="manual"></div>
    <span class="eds-visually-hidden" role="status"></span>
  </div>
  <p class="eds-helper" id="dp-blq-h">Dias úteis, exceto feriados.</p>
</div>
