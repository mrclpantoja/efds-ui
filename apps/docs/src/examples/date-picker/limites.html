<div class="eds-field">
  <label class="eds-label" for="dp-lim">Data da reunião</label>
  <div class="eds-datepicker" data-eds-datepicker data-eds-min="2026-01-01" data-eds-max="2026-12-31">
    <input id="dp-lim" class="eds-input eds-datepicker-input" type="text" inputmode="numeric" maxlength="10"
      placeholder="dd/mm/aaaa" autocomplete="off" aria-describedby="dp-lim-h" />
    <button type="button" class="eds-datepicker-toggle" aria-label="Escolher data"></button>
    <input type="hidden" name="reuniao" />
    <div class="eds-calendar" popover="manual"></div>
    <span class="eds-visually-hidden" role="status"></span>
  </div>
  <p class="eds-helper" id="dp-lim-h">De 01/01/2026 a 31/12/2026.</p>
</div>
