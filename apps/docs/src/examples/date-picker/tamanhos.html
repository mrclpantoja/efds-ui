<div class="eds-stack eds-gap-3">
  <div class="eds-field">
    <label class="eds-label" for="dp-sm">Pequeno</label>
    <div class="eds-datepicker" data-eds-datepicker>
      <input id="dp-sm" class="eds-input eds-input-sm eds-datepicker-input" type="text" inputmode="numeric" maxlength="10"
        placeholder="dd/mm/aaaa" autocomplete="off" />
      <button type="button" class="eds-datepicker-toggle" aria-label="Escolher data"></button>
      <input type="hidden" name="pequeno" />
      <div class="eds-calendar" popover="manual"></div>
      <span class="eds-visually-hidden" role="status"></span>
    </div>
  </div>
  <div class="eds-field">
    <label class="eds-label" for="dp-md">Médio</label>
    <div class="eds-datepicker" data-eds-datepicker>
      <input id="dp-md" class="eds-input eds-datepicker-input" type="text" inputmode="numeric" maxlength="10"
        placeholder="dd/mm/aaaa" autocomplete="off" />
      <button type="button" class="eds-datepicker-toggle" aria-label="Escolher data"></button>
      <input type="hidden" name="medio" />
      <div class="eds-calendar" popover="manual"></div>
      <span class="eds-visually-hidden" role="status"></span>
    </div>
  </div>
  <div class="eds-field">
    <label class="eds-label" for="dp-lg">Grande</label>
    <div class="eds-datepicker" data-eds-datepicker>
      <input id="dp-lg" class="eds-input eds-input-lg eds-datepicker-input" type="text" inputmode="numeric" maxlength="10"
        placeholder="dd/mm/aaaa" autocomplete="off" />
      <button type="button" class="eds-datepicker-toggle" aria-label="Escolher data"></button>
      <input type="hidden" name="grande" />
      <div class="eds-calendar" popover="manual"></div>
      <span class="eds-visually-hidden" role="status"></span>
    </div>
  </div>
</div>
