<div class="eds-field">
  <span class="eds-label" id="dr-b-l">Período do relatório</span>
  <div class="eds-datepicker eds-daterange" data-eds-daterange role="group" aria-labelledby="dr-b-l">
    <input class="eds-input eds-datepicker-input" type="text" inputmode="numeric" maxlength="10" aria-label="Data inicial"
      placeholder="dd/mm/aaaa" autocomplete="off" />
    <span class="eds-daterange-sep" aria-hidden="true">até</span>
    <input class="eds-input eds-datepicker-input" type="text" inputmode="numeric" maxlength="10" aria-label="Data final"
      placeholder="dd/mm/aaaa" autocomplete="off" />
    <button type="button" class="eds-datepicker-toggle" aria-label="Escolher período"></button>
    <input type="hidden" name="inicio" />
    <input type="hidden" name="fim" />
    <div class="eds-calendar" popover="manual"></div>
    <span class="eds-visually-hidden" role="status"></span>
  </div>
</div>
