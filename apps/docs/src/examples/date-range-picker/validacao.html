<form action="#" onsubmit="event.preventDefault()">
  <div class="eds-stack">
    <div class="eds-field">
      <span class="eds-label" id="dr-val-l" data-required>Período de férias</span>
      <div class="eds-datepicker eds-daterange" data-eds-daterange data-eds-min="2026-01-01" data-eds-max="2026-12-31" data-eds-max-days="30" role="group" aria-labelledby="dr-val-l">
        <input class="eds-input eds-datepicker-input" type="text" inputmode="numeric" maxlength="10" aria-label="Data inicial"
          placeholder="dd/mm/aaaa" autocomplete="off" required />
        <span class="eds-daterange-sep" aria-hidden="true">até</span>
        <input class="eds-input eds-datepicker-input" type="text" inputmode="numeric" maxlength="10" aria-label="Data final"
          placeholder="dd/mm/aaaa" autocomplete="off" required />
        <button type="button" class="eds-datepicker-toggle" aria-label="Escolher período"></button>
        <input type="hidden" name="ferias_inicio" />
        <input type="hidden" name="ferias_fim" />
        <div class="eds-calendar" popover="manual"></div>
        <span class="eds-visually-hidden" role="status"></span>
      </div>
    </div>
    <div>
      <button type="submit" class="eds-button eds-button-primary">Solicitar</button>
    </div>
  </div>
</form>
