<!-- Sem JS do pacote. O vertical estica à altura da linha; em <span> leva role="separator" e
     aria-orientation="vertical" (ou aria-hidden="true", se for só visual). -->
<div class="eds-stack eds-stack-row eds-stack-wrap eds-gap-3 eds-stack-align-center">
  <button type="button" class="eds-button eds-button-ghost eds-button-sm">Início</button>
  <span class="eds-divider eds-divider-vertical" role="separator" aria-orientation="vertical"></span>
  <button type="button" class="eds-button eds-button-ghost eds-button-sm">Pedidos</button>
  <span class="eds-divider eds-divider-vertical" role="separator" aria-orientation="vertical"></span>
  <button type="button" class="eds-button eds-button-ghost eds-button-sm">Relatórios</button>
</div>
