<!-- Behavior: [data-eds-error-summary] dentro do form (ou data-eds-error-summary="id-do-form", ou um form
     vizinho). Ao recusar o envio o JS preenche o título (Corrija N campos) e a lista (um link por campo,
     "Rótulo: mensagem"), mostra o resumo e leva o foco a ele; o link leva o foco ao campo. Ao corrigir, o
     item some e o título acompanha; zerado, o resumo se esconde e um anúncio discreto avisa. Em form[data-eds-validate-form]
     o required nativo já basta (sem data-eds-validate). Evento: eds:form-invalid. -->
<form class="eds-stack eds-gap-4" action="/contato" method="post" data-eds-validate-form>
  <div class="eds-error-summary" data-eds-error-summary tabindex="-1" aria-labelledby="es-titulo" hidden>
    <h2 class="eds-error-summary-title" id="es-titulo"></h2>
    <ul class="eds-error-summary-list"></ul>
  </div>
  <div class="eds-field">
    <label class="eds-label" for="es-nome" data-required>Nome</label>
    <input class="eds-input" id="es-nome" name="nome" required autocomplete="off" />
  </div>
  <div class="eds-field">
    <label class="eds-label" for="es-email" data-required>E-mail</label>
    <input class="eds-input" id="es-email" name="email" type="email" required autocomplete="off" />
  </div>
  <div class="eds-field">
    <label class="eds-label" for="es-assunto" data-required>Assunto</label>
    <select class="eds-select" id="es-assunto" name="assunto" required>
      <option value="">Escolha</option>
      <option value="duvida">Dúvida</option>
      <option value="sugestao">Sugestão</option>
    </select>
  </div>
  <div class="eds-field">
    <label class="eds-label" for="es-msg" data-required>Mensagem</label>
    <textarea class="eds-textarea" id="es-msg" name="mensagem" rows="3" required minlength="10"></textarea>
  </div>
  <div>
    <button class="eds-button eds-button-primary" type="submit">Enviar mensagem</button>
  </div>
</form>
