<div class="eds-stack">
  <div class="eds-field">
    <span class="eds-label" id="obrig-l">Com erro</span>
    <div class="eds-upload" data-eds-upload>
      <input id="obrig" class="eds-upload-input" type="file" name="obrigatorios[]" multiple
        aria-invalid="true" aria-labelledby="obrig-l" aria-describedby="obrig-h obrig-e" />
      <label class="eds-upload-dropzone" for="obrig">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9.5 4 4 0 0 1 17 18" /><path d="M12 21v-9m0 0-3 3m3-3 3 3" /></svg>
        <span class="eds-upload-title">Arraste arquivos aqui ou <span class="eds-upload-link">escolha no computador</span></span>
        <span class="eds-upload-hint" id="obrig-h">PDF até 5 MB</span>
      </label>
      <ul class="eds-upload-list" aria-label="Arquivos selecionados"></ul>
      <span class="eds-visually-hidden" role="status"></span>
    </div>
    <p class="eds-error" id="obrig-e">Anexe ao menos um documento.</p>
  </div>
  <div class="eds-field">
    <span class="eds-label" id="bloq-l">Desabilitado</span>
    <div class="eds-upload" data-eds-upload>
      <input id="bloq" class="eds-upload-input" type="file" name="bloqueados[]" multiple disabled
        aria-labelledby="bloq-l" aria-describedby="bloq-h" />
      <label class="eds-upload-dropzone" for="bloq">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9.5 4 4 0 0 1 17 18" /><path d="M12 21v-9m0 0-3 3m3-3 3 3" /></svg>
        <span class="eds-upload-title">Arraste arquivos aqui ou <span class="eds-upload-link">escolha no computador</span></span>
        <span class="eds-upload-hint" id="bloq-h">PDF até 5 MB</span>
      </label>
      <ul class="eds-upload-list" aria-label="Arquivos selecionados"></ul>
      <span class="eds-visually-hidden" role="status"></span>
    </div>
  </div>
</div>
