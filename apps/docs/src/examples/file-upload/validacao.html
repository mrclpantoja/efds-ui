<div class="eds-field">
  <span class="eds-label" id="fotos-l">Fotos da vistoria</span>
  <div class="eds-upload" data-eds-upload data-eds-max-size="2097152" data-eds-max-files="3">
    <input id="fotos" class="eds-upload-input" type="file" name="fotos[]" multiple accept=".jpg,.png"
      aria-labelledby="fotos-l" aria-describedby="fotos-h" />
    <label class="eds-upload-dropzone" for="fotos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9.5 4 4 0 0 1 17 18" /><path d="M12 21v-9m0 0-3 3m3-3 3 3" /></svg>
      <span class="eds-upload-title">Arraste arquivos aqui ou <span class="eds-upload-link">escolha no computador</span></span>
      <span class="eds-upload-hint" id="fotos-h">JPG ou PNG, até 2 MB cada (máx. 3)</span>
    </label>
    <ul class="eds-upload-list" aria-label="Arquivos selecionados"></ul>
    <span class="eds-visually-hidden" role="status"></span>
  </div>
</div>
