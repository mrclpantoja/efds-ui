     -path = pasta inicial, -view = list | grid, -root-label = nome da raiz na trilha.
     Nesta página a API é um adaptador em memória, só com dados fictícios: nada sai do navegador. -->
<div data-eds-files data-eds-files-api="/api/arquivos" data-eds-files-path="/"
  data-eds-files-view="list" aria-label="Arquivos do contrato"></div>
