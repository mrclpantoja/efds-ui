<!-- Behavior: form[data-eds-submit="manual"] — o autor envia e avisa o resultado. No envio válido o form e o botão
     que enviou ganham aria-busy, os outros botões de envio ficam aria-disabled e novos envios são ignorados.
     EDS.submitState(form).track(promessa) termina com sucesso (botão "Salvo" por 2 s, anúncio) ou falha
     (botão "Não foi possível salvar", foco no botão). Textos: data-eds-submit-success-text / -error-text
     (no botão ou no form); duração: data-eds-submit-feedback (ms). Aqui o "servidor" é um setTimeout fictício.
     Dica: se o envio usar fetch, passe { edsLoader: false } para o PageLoader não somar o diálogo ao botão. -->
<form class="eds-stack eds-gap-4" data-eds-submit="manual"
  onsubmit="event.preventDefault(); EDS.submitState(this).track(new Promise((ok, falha) => setTimeout(() => (this.falhar.checked ? falha(new Error('simulada')) : ok()), 1500)))">
  <div class="eds-field">
    <label class="eds-label" for="fs-nome" data-required>Nome do projeto</label>
    <input class="eds-input" id="fs-nome" name="nome" value="Projeto Aurora" required />
  </div>
  <label class="eds-check">
    <input type="checkbox" class="eds-checkbox" name="falhar" />
    <span>Simular falha no servidor</span>
  </label>
  <div class="eds-stack eds-stack-row eds-stack-wrap eds-gap-3">
    <button type="submit" class="eds-button eds-button-primary">Salvar</button>
    <button type="submit" name="acao" value="rascunho" class="eds-button eds-button-secondary">Salvar rascunho</button>
  </div>
</form>
