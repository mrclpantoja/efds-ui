<!-- Só CSS. Ícone decorativo como prefixo/sufixo: o svg dentro de .eds-input-group-text ganha o tamanho
     --eds-icon-size-md. O rótulo continua no <label>; o ícone leva aria-hidden. -->
<div class="eds-grid eds-grid-auto">
  <div class="eds-field">
    <label class="eds-label" for="ig-ico-busca">Buscar contrato</label>
    <div class="eds-input-group">
      <span class="eds-input-group-text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M11 4a7 7 0 100 14 7 7 0 000-14zm9 16l-4-4" /></svg>
      </span>
      <input class="eds-input" id="ig-ico-busca" type="search" />
    </div>
  </div>
  <div class="eds-field">
    <label class="eds-label" for="ig-ico-email">E-mail</label>
    <div class="eds-input-group">
      <input class="eds-input" id="ig-ico-email" type="email" value="maria@exemplo.gov.br" />
      <span class="eds-input-group-text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
      </span>
    </div>
  </div>
</div>
