<div class="eds-grid eds-grid-auto">
  <div class="eds-field">
    <label class="eds-label" for="in-erro">Telefone</label>
    <input id="in-erro" class="eds-input" type="tel" data-eds-mask="telefone" aria-invalid="true" aria-describedby="in-erro-ajuda in-erro-msg" value="(11) 9876" />
    <p class="eds-helper" id="in-erro-ajuda">Com DDD. Ex.: (11) 98765-4321</p>
    <p class="eds-error" id="in-erro-msg">Informe o telefone com DDD.</p>
  </div>
  <div class="eds-field">
    <label class="eds-label" for="in-ok">Código</label>
    <input id="in-ok" class="eds-input" value="PRJ-0042" data-valid="true" aria-describedby="in-ok-msg" />
    <p class="eds-success" id="in-ok-msg">Código disponível.</p>
  </div>
  <div class="eds-field">
    <label class="eds-label" for="in-leitura">Matrícula</label>
    <input id="in-leitura" class="eds-input" value="000123" readonly />
  </div>
  <div class="eds-field">
    <label class="eds-label" for="in-desab">Setor</label>
    <input id="in-desab" class="eds-input" value="Financeiro" disabled />
  </div>
</div>
