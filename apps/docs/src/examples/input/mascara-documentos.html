<div class="eds-grid eds-grid-auto">
  <div class="eds-field">
    <label class="eds-label" for="mk-tel">Telefone</label>
    <input id="mk-tel" class="eds-input" type="tel" name="telefone" data-eds-mask="telefone" aria-describedby="mk-tel-ajuda" />
    <p class="eds-helper" id="mk-tel-ajuda">Com DDD. Ex.: (11) 98765-4321</p>
  </div>
  <div class="eds-field">
    <label class="eds-label" for="mk-cpf">CPF</label>
    <input id="mk-cpf" class="eds-input" name="cpf" data-eds-mask="cpf" aria-describedby="mk-cpf-ajuda" />
    <p class="eds-helper" id="mk-cpf-ajuda">Só números. Ex.: 123.456.789-00</p>
  </div>
  <div class="eds-field">
    <label class="eds-label" for="mk-cnpj">CNPJ</label>
    <input id="mk-cnpj" class="eds-input" name="cnpj" data-eds-mask="cnpj" aria-describedby="mk-cnpj-ajuda" />
    <p class="eds-helper" id="mk-cnpj-ajuda">Aceita letras nas 12 primeiras posições. Ex.: 12.ABC.345/01DE-35</p>
  </div>
  <div class="eds-field">
    <label class="eds-label" for="mk-doc">CPF ou CNPJ</label>
    <input id="mk-doc" class="eds-input" name="documento" data-eds-mask="cpf-cnpj" aria-describedby="mk-doc-ajuda" />
    <p class="eds-helper" id="mk-doc-ajuda">O formato muda sozinho a partir do 12º caractere.</p>
  </div>
  <div class="eds-field">
    <label class="eds-label" for="mk-cep">CEP</label>
    <input id="mk-cep" class="eds-input" name="cep" data-eds-mask="cep" aria-describedby="mk-cep-ajuda" />
    <p class="eds-helper" id="mk-cep-ajuda">Ex.: 90000-000</p>
  </div>
</div>
