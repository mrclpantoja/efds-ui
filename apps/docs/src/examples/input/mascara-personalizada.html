<div class="eds-grid eds-grid-auto">
  <div class="eds-field">
    <label class="eds-label" for="mp-placa">Placa do veículo</label>
    <input id="mp-placa" class="eds-input" name="placa" data-eds-mask="AAA-0*00" aria-describedby="mp-placa-ajuda" />
    <p class="eds-helper" id="mp-placa-ajuda">3 letras, 1 número, 1 letra ou número e 2 números. Ex.: ABC-1D23</p>
  </div>
  <div class="eds-field">
    <label class="eds-label" for="mp-proc">Número do processo</label>
    <input id="mp-proc" class="eds-input" name="processo" data-eds-mask="0000000-00.0000" aria-describedby="mp-proc-ajuda" />
    <p class="eds-helper" id="mp-proc-ajuda">Só números. Ex.: 0001234-56.2026</p>
  </div>
</div>
