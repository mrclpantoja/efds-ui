<!-- Behavior: [data-eds-lookup] com data-eds-lookup-source (URL da busca; ?q= e ?codigo=) e
     data-eds-lookup-dialog (id do <dialog> com busca + Table selecionável). Digitar o código e sair do campo
     resolve a descrição; o botão abre o diálogo; escolher devolve código, descrição e o foco ao campo.
     Código inexistente: aria-invalid + p.eds-error (tirar o hidden). Evento: eds:lookup-change
     (detail {code, description, item}). A descrição usa [data-empty="true"] enquanto não há resultado. -->
<div class="eds-field">
  <label class="eds-label" for="lk-cli">Cliente</label>
  <div class="eds-lookup" data-eds-lookup data-eds-lookup-source="/api/clientes?q=" data-eds-lookup-dialog="dlg-cli">
    <input class="eds-input eds-lookup-code" id="lk-cli" name="cliente" autocomplete="off" aria-describedby="lk-cli-erro" />
    <button type="button" class="eds-button eds-button-secondary eds-button-icon" aria-label="Buscar cliente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M11 4a7 7 0 100 14 7 7 0 000-14zm9 16l-4-4" /></svg>
    </button>
    <output class="eds-lookup-description" for="lk-cli" aria-live="polite" data-empty="true">—</output>
  </div>
  <p class="eds-error" id="lk-cli-erro" hidden></p>
</div>
