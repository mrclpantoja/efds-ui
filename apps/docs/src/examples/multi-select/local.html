<div class="eds-field">
  <label class="eds-label" for="cidades">Cidades atendidas</label>
  <div class="eds-combobox eds-combobox-multiple" data-eds-multiple data-eds-name="cidades[]">
    <div class="eds-combobox-control">
      <ul class="eds-combobox-tags" aria-label="Cidades selecionadas" hidden></ul>
      <input id="cidades" class="eds-combobox-input" type="text" role="combobox" aria-autocomplete="list"
        aria-expanded="false" aria-controls="cidades-lista" autocomplete="off" />
    </div>
    <div class="eds-combobox-popup" popover="manual">
      <ul id="cidades-lista" class="eds-combobox-listbox" role="listbox" aria-multiselectable="true" aria-label="Cidades">
        <li id="cidades-1" class="eds-combobox-option" role="option" aria-selected="false" data-value="poa">Porto Alegre</li>
        <li id="cidades-2" class="eds-combobox-option" role="option" aria-selected="false" data-value="pel">Pelotas</li>
        <li id="cidades-3" class="eds-combobox-option" role="option" aria-selected="false" data-value="pf">Passo Fundo</li>
        <li id="cidades-4" class="eds-combobox-option" role="option" aria-selected="false" data-value="cax">Caxias do Sul</li>
        <li id="cidades-5" class="eds-combobox-option" role="option" aria-selected="false" data-value="sm">Santa Maria</li>
      </ul>
      <p class="eds-combobox-empty" hidden>Nenhum resultado</p>
      <p class="eds-combobox-loading" hidden><span class="eds-spinner eds-spinner-sm" aria-hidden="true"></span> Carregando…</p>
    </div>
    <span class="eds-visually-hidden" role="status"></span>
  </div>
</div>
