<!-- Estados estáticos do medidor e das regras (sem JS). O texto da força é sempre visível. -->
<div class="eds-grid eds-grid-auto">
  <div class="eds-password-strength" data-level="1"><span class="eds-password-strength-bar"></span><span class="eds-password-strength-text">Força: fraca</span></div>
  <div class="eds-password-strength" data-level="2"><span class="eds-password-strength-bar"></span><span class="eds-password-strength-text">Força: razoável</span></div>
  <div class="eds-password-strength" data-level="3"><span class="eds-password-strength-bar"></span><span class="eds-password-strength-text">Força: boa</span></div>
  <div class="eds-password-strength" data-level="4"><span class="eds-password-strength-bar"></span><span class="eds-password-strength-text">Força: forte</span></div>
  <ul class="eds-password-rules">
    <li data-met="true"><span class="eds-visually-hidden">Atendida: </span>Ao menos 8 caracteres</li>
    <li data-met="false"><span class="eds-visually-hidden">Pendente: </span>Ao menos um número</li>
  </ul>
</div>
