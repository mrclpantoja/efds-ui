<!-- Só CSS (o valor muda por JS do autor ou por behavior de upload). O valor também aparece em texto. -->
<div class="eds-stack eds-gap-5">
  <div class="eds-progress-field">
    <div class="eds-progress-header">
      <label class="eds-progress-label" for="prog-1">Importando planilha</label>
      <span class="eds-progress-value">45%</span>
    </div>
    <progress class="eds-progress" id="prog-1" value="45" max="100">45%</progress>
  </div>
  <div class="eds-progress-field">
    <div class="eds-progress-header">
      <label class="eds-progress-label" for="prog-2">Etapa concluída</label>
      <span class="eds-progress-value">100%</span>
    </div>
    <progress class="eds-progress eds-progress-sm eds-progress-success" id="prog-2" value="100" max="100">100%</progress>
  </div>
  <div class="eds-progress-field">
    <div class="eds-progress-header">
      <label class="eds-progress-label" for="prog-3">Cota de armazenamento</label>
      <span class="eds-progress-value">92% usado</span>
    </div>
    <progress class="eds-progress eds-progress-danger" id="prog-3" value="92" max="100">92%</progress>
  </div>
  <div class="eds-progress-field">
    <div class="eds-progress-header">
      <label class="eds-progress-label" for="prog-4">Processando</label>
      <span class="eds-progress-value">aguarde</span>
    </div>
    <progress class="eds-progress" id="prog-4"></progress>
  </div>
</div>
