<fieldset class="eds-fieldset" aria-describedby="pgto-ajuda">
  <legend class="eds-legend" data-required>Forma de pagamento</legend>
  <label class="eds-check">
    <input type="radio" name="pgto" value="boleto" class="eds-radio" required aria-invalid="true" aria-describedby="pgto-erro" />
    Boleto
  </label>
  <label class="eds-check">
    <input type="radio" name="pgto" value="cartao" class="eds-radio" required aria-invalid="true" aria-describedby="pgto-erro" />
    Cartão
  </label>
  <p class="eds-helper" id="pgto-ajuda">A cobrança acontece no fechamento do pedido.</p>
  <p class="eds-error" id="pgto-erro">Escolha uma forma de pagamento.</p>
</fieldset>
