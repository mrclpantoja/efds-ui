<fieldset class="eds-fieldset">
  <legend class="eds-legend" data-required>Prazo de entrega</legend>
  <label class="eds-check">
    <input type="radio" name="prazo" value="padrao" class="eds-radio" checked required />
    Padrão (5 dias úteis)
  </label>
  <label class="eds-check">
    <input type="radio" name="prazo" value="expresso" class="eds-radio" required />
    Expresso (2 dias úteis)
  </label>
  <label class="eds-check">
    <input type="radio" name="prazo" value="retirada" class="eds-radio" disabled required />
    Retirada (indisponível)
  </label>
</fieldset>
