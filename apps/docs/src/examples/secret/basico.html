<!-- Behavior: o botão Mostrar/Ocultar usa [data-eds-password-toggle] (troca type e aria-pressed do input
     [data-eds-password]); o Copiar usa [data-eds-copy="#seg-valor"]. O valor nasce mascarado
     (type="password") e é readonly. O aviso diz que o valor não aparece de novo. -->
<div class="eds-secret">
  <label class="eds-label" for="seg-valor">Token de acesso</label>
  <div class="eds-input-group">
    <input class="eds-input eds-secret-value" id="seg-valor" type="password" readonly autocomplete="off"
      value="TOKEN-EXEMPLO-0000-FICTICIO" data-eds-password aria-describedby="seg-aviso" />
    <button type="button" class="eds-button eds-button-ghost eds-button-icon eds-input-group-button"
      aria-pressed="false" aria-label="Mostrar valor" data-eds-password-toggle>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></svg>
    </button>
    <button type="button" class="eds-button eds-button-ghost eds-button-icon eds-input-group-button eds-copy"
      aria-label="Copiar valor" data-eds-copy="#seg-valor">
      <svg class="eds-copy-icon-idle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V6a2 2 0 012-2h9" /></svg>
      <svg class="eds-copy-icon-done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M5 12l5 5 9-10" /></svg>
    </button>
  </div>
  <p class="eds-secret-warning" id="seg-aviso">Este valor não será mostrado de novo. Guarde-o em local seguro.</p>
</div>
