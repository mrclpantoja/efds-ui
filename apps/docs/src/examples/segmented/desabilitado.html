<!-- Sem JS do pacote. Uma opção desabilitada (disabled no input) ou o grupo todo (fieldset disabled). -->
<div class="eds-stack eds-gap-4">
  <fieldset class="eds-segmented">
    <legend>Período (uma opção indisponível)</legend>
    <label><input type="radio" name="per-d1" value="dia" checked />Dia</label>
    <label><input type="radio" name="per-d1" value="semana" />Semana</label>
    <label><input type="radio" name="per-d1" value="ano" disabled />Ano</label>
  </fieldset>
  <fieldset class="eds-segmented" disabled>
    <legend>Período (grupo desabilitado)</legend>
    <label><input type="radio" name="per-d2" value="dia" checked />Dia</label>
    <label><input type="radio" name="per-d2" value="semana" />Semana</label>
  </fieldset>
</div>
