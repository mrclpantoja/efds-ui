<!-- Sem JS do pacote. Tamanhos: padrão e .eds-segmented-sm; .eds-segmented-fill ocupa a largura toda. -->
<div class="eds-stack eds-gap-4">
  <fieldset class="eds-segmented eds-segmented-sm">
    <legend>Visualização (pequeno)</legend>
    <label><input type="radio" name="vis-sm" value="lista" checked />Lista</label>
    <label><input type="radio" name="vis-sm" value="grade" />Grade</label>
  </fieldset>
  <fieldset class="eds-segmented eds-segmented-fill">
    <legend>Situação (largura total)</legend>
    <label><input type="radio" name="sit" value="todos" checked />Todos</label>
    <label><input type="radio" name="sit" value="abertos" />Abertos</label>
    <label><input type="radio" name="sit" value="fechados" />Fechados</label>
  </fieldset>
</div>
