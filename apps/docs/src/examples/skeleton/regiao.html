<!-- A região de status é irmã do contêiner busy e nasce vazia; o JS escreve "Carregando perfil" nela ao iniciar. -->
<span class="eds-visually-hidden" role="status">Carregando perfil</span>
<div aria-busy="true">
  <article class="eds-card">
    <div class="eds-card-body">
      <div class="eds-stack eds-stack-row eds-stack-align-start eds-gap-3">
        <span class="eds-skeleton eds-skeleton-circle eds-skeleton-shimmer" aria-hidden="true"></span>
        <div class="eds-stack eds-stack-grow eds-gap-0">
          <span class="eds-skeleton eds-skeleton-text eds-skeleton-shimmer" aria-hidden="true"></span>
          <span class="eds-skeleton eds-skeleton-text eds-skeleton-shimmer" aria-hidden="true"></span>
          <span class="eds-skeleton eds-skeleton-text eds-skeleton-shimmer" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </article>
</div>
