<!-- .eds-stat-grid responde à largura do contêiner (1, 2 e 4 colunas). Cada indicador é um .eds-card.eds-stat.
     Uma subida pode ser ruim (inadimplência): data-trend="up" com data-tone="negative".
     O último card mostra o estado carregando (aria-busy + Skeleton, mesmas dimensões do valor).
     O anúncio é um só, no fim da grade (role="status"), não um por card. Aqui o texto é fixo porque o
     exemplo é estático; numa página real a região existe vazia desde o início e o seu JS escreve
     "Carregando indicadores" ao começar (e "Indicadores carregados" ao terminar). Um .eds-stat
     isolado (fora de grade) leva o próprio role="status". -->
<div class="eds-stat-grid">
  <div class="eds-card eds-stat">
    <p class="eds-stat-label">Pedidos no mês</p>
    <p class="eds-stat-value">1.284</p>
    <p class="eds-stat-delta" data-trend="up" data-tone="positive">
      <svg viewBox="0 0 16 16" focusable="false" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" /></svg>
      <span class="eds-visually-hidden">Aumento de</span> 12,4%
      <span class="eds-stat-meta">vs. mês anterior</span>
    </p>
  </div>
  <div class="eds-card eds-stat">
    <p class="eds-stat-label">Faturamento</p>
    <p class="eds-stat-value">R$ 86.410,00</p>
    <p class="eds-stat-delta" data-trend="down" data-tone="negative">
      <svg viewBox="0 0 16 16" focusable="false" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" /></svg>
      <span class="eds-visually-hidden">Queda de</span> 3,1%
      <span class="eds-stat-meta">vs. mês anterior</span>
    </p>
  </div>
  <div class="eds-card eds-stat">
    <p class="eds-stat-label">Inadimplência</p>
    <p class="eds-stat-value">4,8%</p>
    <p class="eds-stat-delta" data-trend="up" data-tone="negative">
      <svg viewBox="0 0 16 16" focusable="false" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" /></svg>
      <span class="eds-visually-hidden">Aumento de</span> 0,6 ponto
      <span class="eds-stat-meta">vs. mês anterior</span>
    </p>
  </div>
  <div class="eds-card eds-stat" aria-busy="true">
    <p class="eds-stat-label"><span class="eds-skeleton eds-skeleton-text" aria-hidden="true"></span></p>
    <p class="eds-stat-value"><span class="eds-skeleton eds-skeleton-text" aria-hidden="true"></span></p>
    <p class="eds-stat-delta"><span class="eds-skeleton eds-skeleton-text" aria-hidden="true"></span></p>
  </div>
  <span class="eds-visually-hidden" role="status">Carregando indicadores</span>
</div>
