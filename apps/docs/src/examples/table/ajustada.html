<!-- .eds-table-fit na <table>: sem largura mínima. Para 2 ou 3 colunas dentro de um card, a tabela
     preenche o contêiner em vez de impor a largura mínima de uma listagem. -->
<div class="eds-card">
  <div class="eds-card-header">
    <h3 class="eds-card-title">Vencimentos da semana</h3>
  </div>
  <div class="eds-table-wrap">
    <table class="eds-table eds-table-fit">
      <caption class="eds-table-caption eds-visually-hidden">Vencimentos da semana</caption>
      <thead>
        <tr>
          <th scope="col">Fornecedor</th>
          <th scope="col" class="eds-table-num">Valor</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Papelaria Exemplo</td><td class="eds-table-num">R$ 1.280,50</td></tr>
        <tr><td>Transportes Modelo</td><td class="eds-table-num">R$ 459,00</td></tr>
        <tr><td>Serviços Fictícios</td><td class="eds-table-num">R$ 8.920,90</td></tr>
      </tbody>
    </table>
  </div>
</div>
