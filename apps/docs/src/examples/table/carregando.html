<!-- Só CSS. Tabela carregando: aria-busy="true" na <table>. Linhas Skeleton (.eds-table-loading) mantêm
     as colunas e a altura de uma linha de dados (sem layout shift). O anúncio vai numa região
     role="status". Aqui o texto é fixo porque o exemplo é estático; numa página real a região existe
     vazia desde o início e o seu JS escreve "Carregando pedidos" ao começar o carregamento (uma
     região que nasce preenchida não é lida). Para recarregar sobre dados já exibidos, deixe as
     linhas reais (ficam esmaecidas) e acrescente, dentro do .eds-table-wrap:
       <div class="eds-table-overlay"><div class="eds-table-overlay-box"><span class="eds-spinner" aria-hidden="true"></span></div></div>
     e ponha o atributo inert na <table> enquanto a sobreposição existir (o foco não entra em controles
     cobertos); ao remover a sobreposição, tire o inert e devolva o foco a quem o tinha. -->
<div class="eds-table-wrap">
  <table class="eds-table" aria-busy="true">
    <caption class="eds-table-caption eds-visually-hidden">Pedidos recentes (carregando)</caption>
    <thead>
      <tr>
        <th scope="col">Código</th>
        <th scope="col">Cliente</th>
        <th scope="col" class="eds-table-num">Total</th>
      </tr>
    </thead>
    <tbody>
      <tr class="eds-table-loading">
        <td><span class="eds-skeleton eds-skeleton-text" aria-hidden="true"></span></td>
        <td><span class="eds-skeleton eds-skeleton-text" aria-hidden="true"></span></td>
        <td class="eds-table-num"><span class="eds-skeleton eds-skeleton-text" aria-hidden="true"></span></td>
      </tr>
      <tr class="eds-table-loading">
        <td><span class="eds-skeleton eds-skeleton-text" aria-hidden="true"></span></td>
        <td><span class="eds-skeleton eds-skeleton-text" aria-hidden="true"></span></td>
        <td class="eds-table-num"><span class="eds-skeleton eds-skeleton-text" aria-hidden="true"></span></td>
      </tr>
      <tr class="eds-table-loading">
        <td><span class="eds-skeleton eds-skeleton-text" aria-hidden="true"></span></td>
        <td><span class="eds-skeleton eds-skeleton-text" aria-hidden="true"></span></td>
        <td class="eds-table-num"><span class="eds-skeleton eds-skeleton-text" aria-hidden="true"></span></td>
      </tr>
    </tbody>
  </table>
  <span class="eds-visually-hidden" role="status">Carregando pedidos</span>
</div>
