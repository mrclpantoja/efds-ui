<!-- .eds-table-stack no .eds-table-wrap: quando o próprio wrap fica abaixo de 40rem, cada linha vira
     um bloco e cada <td data-label="…"> mostra o rótulo antes do valor. O <thead> fica só para leitor
     de tela; a coluna de números continua à direita e as ações ocupam a linha toda, no fim.
     Os papéis ARIA abaixo mantêm a semântica de tabela nos leitores que a perdem quando o display
     da table, do tr e do td muda (redundantes nos demais). Repare que a largura deste preview é
     larga: estreite a janela (ou o contêiner) para ver a mudança. -->
<div class="eds-table-wrap eds-table-stack">
  <table class="eds-table" role="table">
    <caption class="eds-table-caption eds-visually-hidden">Pedidos recentes</caption>
    <thead role="rowgroup">
      <tr role="row">
        <th scope="col" role="columnheader">Código</th>
        <th scope="col" role="columnheader">Cliente</th>
        <th scope="col" role="columnheader">Situação</th>
        <th scope="col" role="columnheader" class="eds-table-num">Total</th>
        <th scope="col" role="columnheader" class="eds-table-actions"><span class="eds-visually-hidden">Ações</span></th>
      </tr>
    </thead>
    <tbody role="rowgroup">
      <tr role="row">
        <td role="cell" data-label="Código">PED-0001</td>
        <td role="cell" data-label="Cliente">Atelier Exemplo</td>
        <td role="cell" data-label="Situação"><span class="eds-badge eds-badge-success">Pago</span></td>
        <td role="cell" data-label="Total" class="eds-table-num">R$ 1.280,50</td>
        <td role="cell" class="eds-table-actions">
          <button type="button" class="eds-button eds-button-secondary eds-button-sm">Ver pedido PED-0001</button>
        </td>
      </tr>
      <tr role="row">
        <td role="cell" data-label="Código">PED-0002</td>
        <td role="cell" data-label="Cliente">Comércio Modelo</td>
        <td role="cell" data-label="Situação"><span class="eds-badge eds-badge-warning">Pendente</span></td>
        <td role="cell" data-label="Total" class="eds-table-num">R$ 459,00</td>
        <td role="cell" class="eds-table-actions">
          <button type="button" class="eds-button eds-button-secondary eds-button-sm">Ver pedido PED-0002</button>
        </td>
      </tr>
      <tr role="row">
        <td role="cell" data-label="Código">PED-0003</td>
        <td role="cell" data-label="Cliente">Oficina Fictícia</td>
        <td role="cell" data-label="Situação"><span class="eds-badge eds-badge-success">Pago</span></td>
        <td role="cell" data-label="Total" class="eds-table-num">R$ 8.920,90</td>
        <td role="cell" class="eds-table-actions">
          <button type="button" class="eds-button eds-button-secondary eds-button-sm">Ver pedido PED-0003</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
