<div class="eds-table-wrap">
  <table class="eds-table">
    <caption class="eds-table-caption eds-visually-hidden">Pedidos (nenhum resultado)</caption>
    <thead>
      <tr>
        <th scope="col">Código</th>
        <th scope="col">Cliente</th>
        <th scope="col" class="eds-table-num">Total</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td colspan="3" class="eds-table-empty">
          <div class="eds-empty">
            <svg class="eds-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
              <path d="M11 4a7 7 0 100 14 7 7 0 000-14zm9 16l-4-4" />
            </svg>
            <h3 class="eds-empty-title">Nenhum pedido encontrado</h3>
            <p class="eds-empty-text">Nenhum resultado para os filtros atuais. Remova um filtro ou crie um novo pedido.</p>
            <div class="eds-empty-actions">
              <button type="button" class="eds-button eds-button-primary eds-button-sm">Novo pedido</button>
              <button type="button" class="eds-button eds-button-secondary eds-button-sm">Limpar busca e filtros</button>
            </div>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
