<!-- Sem JS do pacote: a Tag é estática. Tons por data-tone (neutral é o padrão).
     Badge = estado de um registro; Tag = classificação; Chip = filtro ou botão. -->
<div class="eds-tag-list">
  <span class="eds-tag">Rascunho</span>
  <span class="eds-tag" data-tone="accent">Prioridade</span>
  <span class="eds-tag" data-tone="info">Financeiro</span>
  <span class="eds-tag" data-tone="success">Aprovado</span>
  <span class="eds-tag" data-tone="warning">Revisar</span>
  <span class="eds-tag" data-tone="danger">Bloqueado</span>
</div>
