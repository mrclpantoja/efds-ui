<div class="eds-tag-list">

  <span class="eds-tag eds-tag-success">Aprovado</span>
  <span class="eds-tag eds-tag-warning">Revisar</span>
  <span class="eds-tag eds-tag-danger">Bloqueado</span>
</div>
