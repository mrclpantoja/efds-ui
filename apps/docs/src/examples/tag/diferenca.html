<!-- Sem JS do pacote. Badge x Tag x Chip lado a lado:
     Badge = estado do registro; Tag = rótulo de classificação; Chip = controle (filtro, alternável). -->
<div class="eds-stack eds-gap-4">
  <p class="eds-stack eds-stack-row eds-stack-wrap eds-gap-3 eds-stack-align-center">
    <span class="eds-text-small">Badge (estado)</span>
    <span class="eds-badge eds-badge-success">Pago</span>
  </p>
  <p class="eds-stack eds-stack-row eds-stack-wrap eds-gap-3 eds-stack-align-center">
    <span class="eds-text-small">Tag (classificação)</span>
    <span class="eds-tag" data-tone="info">Financeiro</span>
  </p>
  <p class="eds-stack eds-stack-row eds-stack-wrap eds-gap-3 eds-stack-align-center">
    <span class="eds-text-small">Chip (filtro)</span>
    <button type="button" class="eds-chip" aria-pressed="true">Situação: Pago</button>
  </p>
</div>
