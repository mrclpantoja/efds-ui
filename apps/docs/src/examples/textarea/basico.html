<div class="eds-grid eds-grid-auto">
  <div class="eds-field">
    <label class="eds-label" for="ta-obs">Observações</label>
    <textarea id="ta-obs" class="eds-textarea" aria-describedby="ta-obs-ajuda" placeholder="Detalhes adicionais"></textarea>
    <p class="eds-helper" id="ta-obs-ajuda">Máximo de 500 caracteres.</p>
  </div>
  <div class="eds-field">
    <label class="eds-label" for="ta-just" data-required>Justificativa</label>
    <textarea id="ta-just" class="eds-textarea" required aria-invalid="true" aria-describedby="ta-just-erro"></textarea>
    <p class="eds-error" id="ta-just-erro">A justificativa é obrigatória.</p>
  </div>
  <div class="eds-field">
    <label class="eds-label" for="ta-leitura">Texto fixo</label>
    <textarea id="ta-leitura" class="eds-textarea" readonly>Conteúdo fixo.</textarea>
  </div>
</div>
