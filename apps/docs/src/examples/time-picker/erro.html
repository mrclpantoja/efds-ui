<!-- Behavior: igual ao TimePicker básico. Horário fora do intervalo: o JS põe aria-invalid="true" no campo e
     escreve o motivo em <p class="eds-error"> ligado por aria-describedby. Aqui o estado já vem marcado. -->
<div class="eds-field">
  <label class="eds-label" for="hora-fim">Término</label>
  <div class="eds-timepicker" data-eds-timepicker data-eds-time-step="30" data-eds-min="08:00" data-eds-max="18:00">
    <input id="hora-fim" class="eds-input eds-timepicker-input" type="text" inputmode="numeric" maxlength="5" placeholder="hh:mm" value="19:30" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="hora-fim-lista" aria-invalid="true" aria-describedby="hora-fim-erro" autocomplete="off" />
    <button type="button" class="eds-timepicker-toggle" aria-label="Escolher horário" aria-haspopup="listbox" aria-expanded="false" aria-controls="hora-fim-lista" tabindex="-1"></button>
    <input type="hidden" name="fim" />
    <div class="eds-timepicker-popup" popover="manual">
      <ul class="eds-timepicker-listbox" id="hora-fim-lista" role="listbox" aria-label="Horários de término"></ul>
    </div>
    <span class="eds-visually-hidden" role="status"></span>
  </div>
  <p class="eds-error" id="hora-fim-erro">Escolha um horário entre 08:00 e 18:00.</p>
</div>
