<!-- Sem JS do pacote: <input type="time"> nativo com a aparência do Input (altura, borda, foco e erro).
     O navegador cuida do seletor, do teclado e do formato por locale. Use min, max e step como em qualquer campo. -->
<div class="eds-field">
  <label class="eds-label" for="hora-nativa">Horário de saída</label>
  <input id="hora-nativa" class="eds-input" type="time" name="saida" min="08:00" max="18:00" step="900" aria-describedby="hora-nativa-ajuda" />
  <p class="eds-helper" id="hora-nativa-ajuda">Das 08:00 às 18:00.</p>
</div>
