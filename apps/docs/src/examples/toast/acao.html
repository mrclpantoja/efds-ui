<!-- action: botão no toast (ex.: Desfazer). Fecha o toast e executa onClick. -->
<button type="button" class="eds-button eds-button-secondary"
  onclick="EDS.toast({ variant: 'info', message: 'Pedido PED-0001 excluído.', duration: 8000, action: { label: 'Desfazer', onClick: function () { EDS.toast({ variant: 'success', message: 'Pedido PED-0001 restaurado.' }); } } })">Excluir pedido</button>
