<!-- EDS.toast() é a API do eds-behavior.js (window.EDS); a região aria-live nasce sob demanda. -->
<div class="eds-stack eds-stack-row eds-stack-wrap eds-gap-3">
  <button type="button" class="eds-button eds-button-secondary"
    onclick="EDS.toast({ tone: 'info', title: 'Informação:', message: 'A conciliação roda todos os dias às 02h.' })">Informação</button>
  <button type="button" class="eds-button eds-button-secondary"
    onclick="EDS.toast({ tone: 'success', title: 'Sucesso:', message: 'O contrato foi assinado e arquivado.' })">Sucesso</button>
  <button type="button" class="eds-button eds-button-secondary"
    onclick="EDS.toast({ tone: 'warning', title: 'Atenção:', message: 'O certificado digital vence em 7 dias.' })">Atenção</button>
  <button type="button" class="eds-button eds-button-secondary"
    onclick="EDS.toast({ tone: 'danger', title: 'Erro:', message: 'Não foi possível enviar a nota fiscal.' })">Erro</button>
</div>
